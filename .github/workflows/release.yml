name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '!**.md'
      - '.github/workflows/release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

  build:
    name: Build Jar
    needs: check_wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: master
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Copy CI gradle.properties
        run: |
          cd master
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties \
            ~/.gradle/gradle.properties

      - name: Build and copy webUI, Build Standard Jar
        working-directory: master
        run: ./gradlew :server:downloadWebUI :server:shadowJar --stacktrace

      - name: Isolate Standard Jar
        working-directory: master
        run: |
          mkdir -p server/build/outputs/
          # Buscamos el JAR directamente en server/build/ (sin la subcarpeta libs)
          JAR_FILE=$(find server/build/ -maxdepth 1 -name "*.jar" | head -n 1)
          cp "$JAR_FILE" server/build/outputs/

      - name: Clean Packaging Tasks
        working-directory: master
        run: ./gradlew :server:cleanShadowJar

      - name: Build Alpine Musl Jar
        working-directory: master
        run: |
          ./gradlew :server:shadowJar --stacktrace \
            -Dorg.sqlite.lib.platform=linux_musl64 \
            -Dio.netty.package.libname=netty_transport_native_epoll_x86_64_musl

      - name: Process and Rename Musl Jar
        working-directory: master
        run: |
          # Encontrar el nuevo JAR musl en server/build/
          NEW_JAR=$(find server/build/ -maxdepth 1 -name "*.jar" | head -n 1)
          # Renombrarlo agregándole el sufijo _musl antes de la extensión
          mv "$NEW_JAR" "${NEW_JAR%.jar}_musl.jar"
          # Restaurar el JAR estándar a la carpeta original
          cp server/build/outputs/*.jar server/build/

      - name: Upload Jars
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: master/server/build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: release

      - name: Generate checksums
        run: cd release && sha256sum * > Checksums.sha256

      - name: Get tag from Jar
        run: |
          for file in $(find ./release -name "*_musl.jar"); do
            filename=$(basename "$file" _musl.jar)
            part3=$(echo "$filename" | cut -d'-' -f3)
            echo "TAG=$part3" >> $GITHUB_ENV
          done
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.BUILD_PREVIEW_TOKEN }}
          files: release/*
          prerelease: false
          draft: false
          tag_name: ${{ env.TAG }}
